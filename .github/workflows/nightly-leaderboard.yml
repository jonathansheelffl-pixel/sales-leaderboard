name: Nightly Sales Leaderboard

on:
  schedule:
  # Runs every 10 minutes, every day. The script itself checks the time in
    # Mountain Time and decides what to do: update the running "live"
    # leaderboard during the day (7 AM-10 PM, Mon-Sat), post the final
    # leaderboard at 10 PM, or do nothing (nights, Sundays). This doesn't
    # need to change for Daylight Saving Time and can't post/edit twice.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you click "Run workflow" on GitHub to test it manually

permissions:
  contents: write   # needed for the monthly keep-alive commit below

jobs:
  post-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run leaderboard script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python leaderboard.py

      - name: Keep repository active
        # GitHub switches off scheduled workflows after 60 days with no
        # repository activity. Make a tiny empty commit if the last one is
        # more than 30 days old so this never happens again.
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            git config user.name "leaderboard-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive commit"
            git push
          fi
