name: Nightly Sales Leaderboard

on:
  schedule:
  # Runs every 10 minutes, every day. The script itself checks the time in
    # Mountain Time and decides what to do: update the running "live"
    # leaderboard during the day (7 AM-10 PM, Mon-Sat), post the final
    # leaderboard at 10 PM, or do nothing (nights, Sundays). This doesn't
    # need to change for Daylight Saving Time and can't post/edit twice.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you click "Run workflow" on GitHub to test it manually

jobs:
  post-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run leaderboard script
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python leaderboard.py
